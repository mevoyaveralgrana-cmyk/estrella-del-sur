<!DOCTYPE html>
<html lang="es">
<head>

<title>Estrella del Sur</title>
<link rel="icon" href='data:image/svg+xml;utf8,%3Csvg viewBox=%220 0 466 538%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cpath d=%22M6,86 C82,104 176,94 233,8 C290,94 384,104 460,86 C460,300 378,472 233,532 C88,472 6,300 6,86 Z%22 fill=%22%23fff%22 stroke=%22%23000%22 stroke-width=%2217%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M48,146 L145,133 L233,478 C160,415 88,290 48,146 Z%22 fill=%22%23ce1417%22/%3E%3Cpath d=%22M418,146 L321,133 L233,478 C306,415 378,290 418,146 Z%22 fill=%22%23ce1417%22/%3E%3Cpath d=%22M233,88 L248,131 L294,132 L258,160 L271,204 L233,178 L195,204 L208,160 L172,132 L218,131 Z%22 fill=%22%23ce1417%22/%3E%3C/svg%3E'>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>

:root{
  --bg:#0e1117; --panel:#161b25; --panel2:#1d2432; --line:#2a3346;
  --txt:#e6ebf5; --muted:#8b97ad; --acc:#ff5f5f; --acc2:#ce1417; --brand:#ce1417;
  --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5}
#app{display:flex;min-height:100vh}
/* NAV */
nav{width:212px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:9px;padding:0 8px 16px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand .star{width:34px;height:38px;flex-shrink:0;display:grid;place-items:center}
.brand .star svg{width:100%;height:100%;display:block}
.brand b{font-size:15px;letter-spacing:-.2px}
.brand small{display:block;color:var(--muted);font-size:10.5px;font-weight:400;letter-spacing:.4px;text-transform:uppercase}
nav a{display:flex;align-items:center;gap:9px;padding:8.5px 10px;border-radius:8px;color:var(--muted);text-decoration:none;cursor:pointer;font-weight:500;margin-bottom:2px;transition:.12s}
nav a:hover{background:var(--panel2);color:var(--txt)}
nav a.on{background:var(--acc2);color:#fff}
nav a .ic{width:18px;text-align:center;font-size:14px}
nav a .badge{margin-left:auto;background:var(--bad);color:#fff;font-size:10px;padding:1px 6px;border-radius:9px;font-weight:700}
/* MAIN */
main{flex:1;padding:22px 26px;max-width:1500px;overflow-x:hidden}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:22px;font-weight:700;letter-spacing:-.4px}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
h2{font-size:15px;font-weight:650;margin-bottom:10px;display:flex;align-items:center;gap:8px}
/* CARDS */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(155px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi .n{font-size:27px;font-weight:750;letter-spacing:-1px;line-height:1.1}
.kpi .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-top:3px;font-weight:600}
/* FORM */
input,select,textarea,button{font-family:inherit;font-size:13px}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:8px 10px;border-radius:7px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc2)}
label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.f{margin-bottom:10px}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
button{background:var(--acc2);color:#fff;border:none;padding:8.5px 15px;border-radius:7px;cursor:pointer;font-weight:600;transition:.12s}
button:hover{filter:brightness(1.12)}
button.gh{background:transparent;border:1px solid var(--line);color:var(--muted)}
button.gh:hover{color:var(--txt);border-color:var(--muted)}
button.sm{padding:4px 9px;font-size:11.5px}
button.dgr{background:var(--bad)}
button.gld{background:#fff;color:#111}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* TABLE */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:7px 9px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
td{padding:8px 9px;border-bottom:1px solid rgba(42,51,70,.5);vertical-align:middle}
tbody tr:hover{background:var(--panel2)}
td.num,th.num{text-align:center}
.tw{overflow-x:auto}
/* TAGS */
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.t-ok{background:rgba(34,197,94,.15);color:#4ade80}
.t-warn{background:rgba(245,158,11,.15);color:#fbbf24}
.t-bad{background:rgba(239,68,68,.15);color:#f87171}
.t-inf{background:rgba(59,130,246,.15);color:#93c5fd}
.t-mut{background:var(--panel2);color:var(--muted)}
.pill{background:var(--panel2);border:1px solid var(--line);padding:3px 9px;border-radius:20px;font-size:11.5px;color:var(--muted)}
.mut{color:var(--muted)}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty .e{font-size:32px;opacity:.35;display:block;margin-bottom:8px}
/* TABS */
.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto;padding-bottom:0}
.tabs span{padding:8px 13px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-weight:600;font-size:13px;white-space:nowrap}
.tabs span.on{color:var(--acc);border-bottom-color:var(--acc)}
/* MODAL */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;place-items:center;z-index:60;padding:18px;backdrop-filter:blur(2px)}
.mask.on{display:grid}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:20px;width:100%;max-width:620px;max-height:88vh;overflow-y:auto}
.modal h3{font-size:16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.x{cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
/* MISC */
.alert{border-radius:8px;padding:10px 13px;margin-bottom:9px;border-left:3px solid;font-size:13px}
.a-bad{background:rgba(239,68,68,.08);border-color:var(--bad)}
.a-warn{background:rgba(245,158,11,.08);border-color:var(--warn)}
.a-inf{background:rgba(59,130,246,.08);border-color:var(--acc2)}
.chk{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;background:var(--panel2)}
.chk:hover{border-color:var(--acc2)}
.chk.blk{opacity:.5;cursor:not-allowed;background:transparent}
.chk.sel{border-color:var(--acc2);background:rgba(59,130,246,.1)}
.chk input{width:16px;height:16px;flex-shrink:0;accent-color:var(--acc2)}
.chk .nm{flex:1;font-weight:600}
.scr{font-family:ui-monospace,monospace;font-size:15px;font-weight:700}
pre.out{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:13px;white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:12px;max-height:340px;overflow-y:auto;color:var(--txt)}
.toast{position:fixed;bottom:22px;right:22px;background:var(--ok);color:#0b1211;padding:11px 17px;border-radius:9px;font-weight:650;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.bar{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc2)}
@media(max-width:860px){
  #app{flex-direction:column}
  nav{width:100%;height:auto;position:static;display:flex;overflow-x:auto;padding:9px;gap:4px}
  nav .brand{display:none}
  nav a{white-space:nowrap;margin:0}
  main{padding:15px}
}

/* ---- LOGIN / PANTALLAS PLENAS ---- */
#gate{min-height:100vh;display:grid;place-items:center;padding:20px}
.box{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px}
.box .lg{width:74px;height:84px;margin:0 auto 14px}
.box .lg svg{width:100%;height:100%}
.box h1{font-size:20px;text-align:center;margin-bottom:3px}
.box .s{text-align:center;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1.4px;margin-bottom:22px}
.box button{width:100%;padding:11px;margin-top:6px}
.swap{text-align:center;margin-top:15px;font-size:12.5px;color:var(--muted)}
.swap a{color:var(--acc);cursor:pointer;text-decoration:none;font-weight:600}
.err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);color:#fca5a5;padding:9px 12px;border-radius:8px;font-size:12.5px;margin-bottom:12px}
.okm{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.35);color:#86efac;padding:9px 12px;border-radius:8px;font-size:12.5px;margin-bottom:12px}
#pub{max-width:620px;margin:0 auto;padding:26px 18px}
#pub .hd{display:flex;align-items:center;gap:15px;margin-bottom:22px}
#pub .hd .lg{width:56px;height:64px;flex-shrink:0}
#pub .hd .lg svg{width:100%;height:100%}
.load{display:grid;place-items:center;min-height:100vh;color:var(--muted);gap:14px}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--acc2);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.me{display:flex;align-items:center;gap:9px;padding:9px 10px;border-top:1px solid var(--line);margin-top:10px;font-size:12px}
.me .av{width:28px;height:28px;border-radius:50%;background:var(--acc2);display:grid;place-items:center;font-weight:700;font-size:12px;flex-shrink:0}
.me b{display:block;font-size:12.5px;line-height:1.3}
.me span{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px}
.ro{background:var(--panel2);border:1px solid var(--line);padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.ro.dir{background:rgba(206,20,23,.18);color:#ff8080;border-color:rgba(206,20,23,.4)}
.ro.dt{background:rgba(59,130,246,.15);color:#93c5fd;border-color:rgba(59,130,246,.35)}
.lnk{display:flex;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-family:ui-monospace,monospace;font-size:11.5px;word-break:break-all}
</style>

<body>
<div id="root"><div class="load"><div class="spin"></div><div>Conectando…</div></div></div>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script>
/* ============================================================
   ESTRELLA DEL SUR — configuración de conexión
   Reemplazá estos dos valores por los de TU proyecto Supabase.
   Están en: Supabase → Project Settings → API
   ============================================================ */
const CFG = {
  url: 'https://jbgmsebkbciridldveys.supabase.co',
  key: 'sb_publishable_UXsCZCm5jjDmcQ2V5X003Q_3FKHFN4l'
};
/* ============================================================ */
const ESCUDO = `<svg viewBox="0 0 466 538" xmlns="http://www.w3.org/2000/svg"><path d="M6,86 C82,104 176,94 233,8 C290,94 384,104 460,86 C460,300 378,472 233,532 C88,472 6,300 6,86 Z" fill="#fff" stroke="#000" stroke-width="17" stroke-linejoin="round"/><path d="M48,146 L145,133 L233,478 C160,415 88,290 48,146 Z" fill="#ce1417"/><path d="M418,146 L321,133 L233,478 C306,415 378,290 418,146 Z" fill="#ce1417"/><path d="M233,88 L248,131 L294,132 L258,160 L271,204 L233,178 L195,204 L208,160 L172,132 L218,131 Z" fill="#ce1417"/></svg>`;
/* ============ CLIENTE Y ESTADO ============ */
let SB=null, YO=null, V='panel', F={cat:'',torneo:''}, SANC=[];
let DB={config:{},categorias:[],equipos:[],jugadores:[],partidos:[],stats:[],sanciones:[],citaciones:[],altas:[],perfiles:[]};

const $=id=>document.getElementById(id);
const root=()=>$('root');
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(m,malo){ const t=$('toast'); t.textContent=m; t.style.background=malo?'var(--bad)':'var(--ok)'; t.style.color=malo?'#fff':'#0b1211'; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),2800); }
function fdate(d){ if(!d)return '—'; const p=String(d).slice(0,10).split('-'); return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:d; }
function hoy(){ return new Date().toISOString().slice(0,10); }
function dias(d){ if(!d)return null; return Math.round((new Date(String(d).slice(0,10)+'T12:00')-new Date(hoy()+'T12:00'))/864e5); }
function edadDe(j){ return (j&&j.edad!=null)?j.edad:edad(j&&j.nac); }
function edad(f){ if(!f)return '—'; const b=new Date(f),n=new Date(); let a=n.getFullYear()-b.getFullYear(); const m=n.getMonth()-b.getMonth(); if(m<0||(m===0&&n.getDate()<b.getDate()))a--; return a; }
function val(id){ const e=$(id); return e?String(e.value).trim():''; }
function chk(id){ const e=$(id); return e?e.checked:false; }
function nn(v){ return v===''?null:v; }

/* atajos */
const cat=id=>DB.categorias.find(c=>c.id===id)||{nombre:'—'};
const eq =id=>DB.equipos.find(e=>e.id===id)||{nombre:'—'};
const jug=id=>DB.jugadores.find(j=>j.id===id)||{nombre:'—'};
const propio=()=>DB.equipos.find(e=>e.propio)||{id:'',nombre:DB.config.club||'Estrella del Sur'};
const cats=()=>DB.categorias;
const jugsDe=c=>DB.jugadores.filter(j=>j.cat===c&&j.estado!=='baja');
const partsDe=c=>DB.partidos.filter(p=>!c||p.cat===c);
const RAMAS=['Masculino','Femenino','Veteranos','Otras'];

/* permisos */
const esPub =()=>!YO||YO.rol==='publico';
const esDir =()=>YO&&YO.rol==='dirigente';
const esDT  =()=>YO&&YO.rol==='dt';
const esJug =()=>YO&&YO.rol==='jugador';
const puedeCat=c=>esDir()||(esDT()&&c&&c===YO.cat);
const miJugador=()=>DB.jugadores.find(j=>j.user_id===YO.user_id);
const ROL={dirigente:'Dirigente',dt:'Entrenador',jugador:'Jugador',publico:'Vista pública'};

/* ============ CARGA DE DATOS ============ */
const pIn =r=>({...r,local:r.eq_local,visitante:r.eq_visita});
const pOut=o=>({id:o.id,cat:o.cat,torneo:o.torneo,fnro:o.fnro,fecha:nn(o.fecha),hora:o.hora,cancha:o.cancha,
  eq_local:o.local,eq_visita:o.visitante,gl:o.gl,gv:o.gv,arbitro:o.arbitro,jugado:o.jugado});
const cIn =r=>({club:r.club,temporada:r.temporada,topeAmarillas:r.tope_amarillas,fechasRoja:r.fechas_roja,
  ptsVictoria:r.pts_victoria,ptsEmpate:r.pts_empate,token:r.token_alta});

async function cargarTodo(){
  const pub=esPub();
  const q=t=>SB.from(t).select('*');
  const [cf,ca,eqs,ju,pa,st,sa,ci,pe]=await Promise.all([
    SB.from(pub?'pub_config':'config').select('*').eq('id',1).single(),
    SB.from('categorias').select('*').order('orden'),
    SB.from('equipos').select('*').order('nombre'),
    q(pub?'pub_jugadores':'jugadores'),q('partidos'),q('stats'),q('sanciones'),q('citaciones'),
    pub?Promise.resolve({data:[],error:null}):q('perfiles')]);
  const err=[cf,ca,eqs,ju,pa,st,sa,ci,pe].find(r=>r.error);
  if(err){ throw new Error(err.error.message); }
  DB.config=cIn(cf.data);
  DB.categorias=ca.data||[]; DB.equipos=eqs.data||[]; DB.jugadores=ju.data||[];
  DB.partidos=(pa.data||[]).map(pIn); DB.stats=st.data||[]; DB.sanciones=sa.data||[];
  DB.citaciones=ci.data||[]; DB.perfiles=pe.data||[];
  DB.altas=[];
  if(esDir()){ const a=await SB.from('altas').select('*').eq('estado','pendiente').order('creada'); DB.altas=a.data||[]; }
}
async function guardar(tabla,filas,opts){
  const {error}=await SB.from(tabla).upsert(filas,opts||{});
  if(error){ toast(traducir(error.message),true); return false; }
  return true;
}
async function borrarFila(tabla,id){
  const {error}=await SB.from(tabla).delete().eq('id',id);
  if(error){ toast(traducir(error.message),true); return false; }
  return true;
}
function traducir(m){
  if(/row-level security|violates row-level/i.test(m)) return 'No tenés permiso para hacer eso';
  if(/duplicate key/i.test(m)) return 'Ese registro ya existe';
  if(/Invalid login/i.test(m)) return 'Email o contraseña incorrectos';
  if(/already registered/i.test(m)) return 'Ese email ya está registrado';
  if(/at least 6/i.test(m)) return 'La contraseña necesita al menos 6 caracteres';
  if(/Email not confirmed/i.test(m)) return 'Falta confirmar el email (revisá tu casilla)';
  return m;
}
async function refrescar(){ try{ await cargarTodo(); render(); }catch(e){ toast(e.message,true); } }

/* ============ MOTOR DE DISCIPLINA (calculado, no almacenado) ============
   La tabla `sanciones` guarda SOLO lo que se carga a mano (tribunal, rivales).
   Las rojas de planilla y la acumulación de amarillas se derivan en el momento,
   así nunca se duplican ni quedan desfasadas.                                */
function amarillasTotales(jid){
  let t=0;
  DB.stats.filter(s=>s.jid===jid).forEach(s=>{
    const p=DB.partidos.find(x=>x.id===s.pid);
    if(p&&p.jugado) t+=(+s.am||0);
  });
  return t;
}
function amarillasAcum(jid){ const t=DB.config.topeAmarillas||5; return amarillasTotales(jid)%t; }

function fechasJugadas(catId,eqId,desde){
  return DB.partidos.filter(p=>p.jugado&&p.cat===catId&&(p.fecha||'')>(desde||'')&&
    (p.local===eqId||p.visitante===eqId)).length;
}
function calcularSanciones(){
  const out=[], tope=DB.config.topeAmarillas||5, yo=propio().id;
  const push=s=>{
    const eqId=s.jid?yo:s.eqid;
    const cum=Math.min(s.total,(s.cumplidas||0)+fechasJugadas(s.cat,eqId,s.desde));
    out.push({...s,cumplidas:cum,rest:Math.max(0,s.total-cum),activa:cum<s.total});
  };
  // 1. cargadas a mano (tribunal propio y de rivales)
  DB.sanciones.forEach(push);
  // 2. rojas de planilla
  DB.stats.filter(s=>s.roja).forEach(s=>{
    const p=DB.partidos.find(x=>x.id===s.pid); if(!p||!p.jugado)return;
    const j=DB.jugadores.find(x=>x.id===s.jid); if(!j)return;
    if(DB.sanciones.some(x=>x.origen==='roja-'+s.pid+'-'+s.jid))return;
    push({id:'auto-roja-'+s.pid+'-'+s.jid,jid:s.jid,cat:p.cat,tipo:'roja',auto:true,
      total:DB.config.fechasRoja||1,cumplidas:0,desde:p.fecha,
      motivo:'Expulsión vs '+eq(p.local===yo?p.visitante:p.local).nombre});
  });
  // 3. acumulación de amarillas
  DB.jugadores.forEach(j=>{
    const n=Math.floor(amarillasTotales(j.id)/tope);
    if(!n)return;
    const jugados=DB.partidos.filter(p=>p.jugado&&p.cat===j.cat&&(p.local===yo||p.visitante===yo))
      .sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
    let acum=0, disparos=[];
    jugados.forEach(p=>{
      const s=DB.stats.find(x=>x.pid===p.id&&x.jid===j.id);
      acum+=s?(+s.am||0):0;
      while(disparos.length<Math.floor(acum/tope)) disparos.push(p.fecha);
    });
    disparos.forEach((f,i)=>push({id:'auto-acum-'+j.id+'-'+i,jid:j.id,cat:j.cat,tipo:'acumulacion',auto:true,
      total:1,cumplidas:0,desde:f,motivo:'Acumulación de '+tope+' amarillas'}));
  });
  return out;
}
const suspendidos=c=>SANC.filter(s=>s.rest>0&&(!c||s.cat===c));

function estado(jid){
  const j=jug(jid);
  const act=SANC.filter(s=>s.jid===jid&&s.rest>0);
  const rest=act.reduce((a,s)=>a+s.rest,0);
  if(rest>0) return {ok:false,cls:'t-bad',txt:'SUSPENDIDO ('+rest+' fecha'+(rest>1?'s':'')+')',motivo:act.map(s=>s.motivo).join(' · '),rest};
  if(j.estado==='lesionado') return {ok:false,cls:'t-bad',txt:'LESIONADO',motivo:j.lesion||'Sin detalle',rest:0};
  const am=amarillasAcum(jid), tope=DB.config.topeAmarillas||5;
  if(am>=tope-1) return {ok:true,cls:'t-warn',txt:'EN RIESGO ('+am+'/'+tope+')',motivo:'A una amarilla de la suspensión',rest:0};
  return {ok:true,cls:'t-ok',txt:'HABILITADO',motivo:'',rest:0};
}
/* ============ TABLA Y ESTADÍSTICAS ============ */
function tabla(c,torneo){
  const T={}, add=id=>{ if(!T[id])T[id]={id,pj:0,g:0,e:0,p:0,gf:0,gc:0}; return T[id]; };
  DB.partidos.filter(p=>p.jugado&&(!c||p.cat===c)&&(!torneo||p.torneo===torneo)).forEach(p=>{
    if(!p.local||!p.visitante)return;
    const L=add(p.local),Vi=add(p.visitante),gl=+p.gl||0,gv=+p.gv||0;
    L.pj++;Vi.pj++;L.gf+=gl;L.gc+=gv;Vi.gf+=gv;Vi.gc+=gl;
    if(gl>gv){L.g++;Vi.p++;} else if(gl<gv){Vi.g++;L.p++;} else {L.e++;Vi.e++;}
  });
  const pv=DB.config.ptsVictoria||3, pe=DB.config.ptsEmpate||1;
  return Object.values(T).map(t=>({...t,pts:t.g*pv+t.e*pe,dif:t.gf-t.gc}))
    .sort((a,b)=>b.pts-a.pts||b.dif-a.dif||b.gf-a.gf||eq(a.id).nombre.localeCompare(eq(b.id).nombre));
}
function statsJug(jid,c,torneo){
  const r={pj:0,tit:0,min:0,g:0,a:0,am:0,rj:0,fal:0,gr:0,vi:0};
  DB.stats.filter(s=>s.jid===jid).forEach(s=>{
    const p=DB.partidos.find(x=>x.id===s.pid);
    if(!p||!p.jugado)return; if(c&&p.cat!==c)return; if(torneo&&p.torneo!==torneo)return;
    r.pj++; if(s.tit)r.tit++; r.min+=+s.min||0; r.g+=+s.g||0; r.a+=+s.a||0;
    r.am+=+s.am||0; if(s.roja)r.rj++; r.fal+=+s.fal||0;
    if(jug(jid).pos==='Arquero'){ const rec=+s.gr||0; r.gr+=rec; if(rec===0&&(+s.min||0)>0)r.vi++; }
  });
  return r;
}

async function savePlanilla(pid){
  const p=DB.partidos.find(x=>x.id===pid), filas=[], borrar=[];
  jugsDe(p.cat).forEach(j=>{
    const g=k=>{ const e=$('s_'+k+'_'+j.id); return e?(e.type==='checkbox'?e.checked:(e.value===''?0:+e.value)):0; };
    const o={pid,jid:j.id,tit:g('tit'),min:g('min'),g:g('g'),a:g('a'),am:g('am'),roja:g('roja'),fal:g('fal'),gr:g('gr')};
    const prev=DB.stats.find(s=>s.pid===pid&&s.jid===j.id);
    const vacia=!o.tit&&!o.min&&!o.g&&!o.a&&!o.am&&!o.roja&&!o.fal&&!o.gr;
    if(vacia){ if(prev)borrar.push(prev.id); } else { if(prev)o.id=prev.id; filas.push(o); }
  });
  if(filas.length&&!await guardar('stats',filas,{onConflict:'pid,jid'}))return;
  for(const id of borrar) await borrarFila('stats',id);
  if(!p.jugado){ const {error}=await SB.from('partidos').update({jugado:true}).eq('id',pid); if(error)toast(traducir(error.message),true); }
  cerrar(); await refrescar(); toast('Planilla guardada · disciplina actualizada');
}

  '<div class="f"><label>Entrenador</label><input id="kD" value="'+esc(c.dt||'')+'"></div></div>'+
  '<div class="btns"><button onclick="saveCat(\''+(id||'')+'\')">Guardar</button><button class="gh" onclick="cerrar()">Cancelar</button>'+
  (id?'<button class="dgr sm" style="margin-left:auto" onclick="delCat(\''+id+'\')">Eliminar</button>':'')+'</div>');
}
async function saveCat(id){
  if(!val('kN')) return toast('Falta el nombre',true);
  const o={nombre:val('kN'),rama:val('kR'),dt:val('kD'),orden:id?(cats().find(x=>x.id===id).orden||0):cats().length+1};
  if(id)o.id=id;
  if(!await guardar('categorias',o))return;
  cerrar(); await refrescar(); toast('Categoría guardada');
}
async function delCat(id){
  if(DB.jugadores.some(j=>j.cat===id)) return toast('Tiene jugadores asignados',true);
  if(!await borrarFila('categorias',id))return;
  cerrar(); await refrescar(); toast('Categoría eliminada');
}
async function nuevoToken(){
  if(!confirm('El link anterior deja de funcionar. ¿Seguro?'))return;
  const t=Array.from(crypto.getRandomValues(new Uint8Array(9))).map(b=>b.toString(16).padStart(2,'0')).join('');
  const {error}=await SB.from('config').update({token_alta:t}).eq('id',1);
  if(error)return toast(traducir(error.message),true);
  await refrescar(); toast('Link nuevo generado');
}
function exportar(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}));
  a.download='estrella-del-sur-'+hoy()+'.json'; a.click(); toast('Backup descargado');
}
function exportarCSV(){
  const rows=[['Jugador','Categoria','Posicion','PJ','Titular','Minutos','Goles','Asistencias','Amarillas','Rojas','Faltas','Estado']];
  DB.jugadores.forEach(j=>{ const s=statsJug(j.id);
    rows.push([j.nombre,cat(j.cat).nombre,j.pos||'',s.pj,s.tit,s.min,s.g,s.a,s.am,s.rj,s.fal,estado(j.id).txt]); });
  const csv='﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='estadisticas-'+hoy()+'.csv'; a.click(); toast('CSV descargado');
}
